[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-group-bot"
version = "0.1.0"
description = "Autonomous Telegram userbot agent for group chats"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jeff", email = "jeff@example.com" },
]
dependencies = [
    "pydantic>=2.0",
    "google-antigravity>=0.1.23",
    "telethon>=1.36.0",
    "pillow>=10.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.0.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
    "edge-tts>=7.0.0",
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "reportlab>=4.0",
]

[project.scripts]
telegram-group-bot = "bot.cli:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
